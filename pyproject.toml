[project]
name = "x86-register-lsp"
version = "0.1.0"
description = "x86_64 register tracking LSP for Neovim"
requires-python = ">=3.11"
dependencies = [
    "pygls>=1.3.0",
    "capstone>=5.0.0",
    "unicorn>=2.0.0",
    "keystone-engine>=0.9.2",
]

[project.scripts]
x86-register-lsp = "server.server:main"

[tool.setuptools.packages.find]
include = ["server*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
